<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="./icons/Book.ico" type="image/x-icon">
    <title>Project: Library</title>
</head>

<body class="container">
    <div class="header">

                </svg>
            </div>
            <div>MyLibrary.com</div>
        </div>
        <div class="search-field">
            <input type="search" id="searchBook" placeholder="Exact book title">

                    <title>Search book</title>

                </svg></button>
        </div>
        <button class="add-book-btn">Add new book <svg class="add-book-icon" xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24">
                <path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" />
            </svg></button>
    </div>
    <div class="main">
        <div class="card">
            <img class="book-img" src="images/1984.webp">
            <div class="book-info">
                <p class="book-id"></p>
                <p class="title"></p>
                <p class="author"></p>
                <p class="pages"></p>
                <p class="status"></p>

            </div>
            <div class="book-action">
                <svg class="change-status-btn" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <title>Change status</title>
                    <path
                        d="M23.5,17L18.5,22L15,18.5L16.5,17L18.5,19L22,15.5L23.5,17M12,9A3,3 0 0,1 15,12A3,3 0 0,1 12,15A3,3 0 0,1 9,12A3,3 0 0,1 12,9M12,4.5C17,4.5 21.27,7.61 23,12C22.75,12.65 22.44,13.26 22.08,13.85C21.5,13.5 20.86,13.25 20.18,13.12L20.82,12C19.17,8.64 15.76,6.5 12,6.5C8.24,6.5 4.83,8.64 3.18,12C4.83,15.36 8.24,17.5 12,17.5L13.21,17.43C13.07,17.93 13,18.46 13,19V19.46L12,19.5C7,19.5 2.73,16.39 1,12C2.73,7.61 7,4.5 12,4.5Z" />
                </svg>
                <svg class="delete-book-btn" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <title>Delete book</title>
                    <path
                        d="M9,3V4H4V6H5V19A2,2 0 0,0 7,21H17A2,2 0 0,0 19,19V6H20V4H15V3H9M7,6H17V19H7V6M9,8V17H11V8H9M13,8V17H15V8H13Z" />
                </svg>
            </div>
        </div>
        <div class="card">
            <img class="book-img" src="images/evgeniy_onegin.jpg">
            <div class="book-info">
                <p class="book-id"></p>
                <p class="title"></p>
                <p class="author"></p>
                <p class="pages"></p>
                <p class="status"></p>


            </div>
            <div class="book-action">
                <svg class="change-status-btn" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <title>Change status</title>
                    <path
                        d="M23.5,17L18.5,22L15,18.5L16.5,17L18.5,19L22,15.5L23.5,17M12,9A3,3 0 0,1 15,12A3,3 0 0,1 12,15A3,3 0 0,1 9,12A3,3 0 0,1 12,9M12,4.5C17,4.5 21.27,7.61 23,12C22.75,12.65 22.44,13.26 22.08,13.85C21.5,13.5 20.86,13.25 20.18,13.12L20.82,12C19.17,8.64 15.76,6.5 12,6.5C8.24,6.5 4.83,8.64 3.18,12C4.83,15.36 8.24,17.5 12,17.5L13.21,17.43C13.07,17.93 13,18.46 13,19V19.46L12,19.5C7,19.5 2.73,16.39 1,12C2.73,7.61 7,4.5 12,4.5Z" />
                </svg>
                <svg class="delete-book-btn" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <title>Delete book</title>
                    <path
                        d="M9,3V4H4V6H5V19A2,2 0 0,0 7,21H17A2,2 0 0,0 19,19V6H20V4H15V3H9M7,6H17V19H7V6M9,8V17H11V8H9M13,8V17H15V8H13Z" />
                </svg>
            </div>
        </div>
        <div class="card">
            <img class="book-img" src="images/the_Little_Prince.jpg">
            <div class="book-info">
                <p class="book-id"></p>
                <p class="title"></p>
                <p class="author"></p>
                <p class="pages"></p>
                <p class="status"></p>

            </div>
            <div class="book-action">
                <svg class="change-status-btn" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <title>Change status</title>
                    <path
                        d="M23.5,17L18.5,22L15,18.5L16.5,17L18.5,19L22,15.5L23.5,17M12,9A3,3 0 0,1 15,12A3,3 0 0,1 12,15A3,3 0 0,1 9,12A3,3 0 0,1 12,9M12,4.5C17,4.5 21.27,7.61 23,12C22.75,12.65 22.44,13.26 22.08,13.85C21.5,13.5 20.86,13.25 20.18,13.12L20.82,12C19.17,8.64 15.76,6.5 12,6.5C8.24,6.5 4.83,8.64 3.18,12C4.83,15.36 8.24,17.5 12,17.5L13.21,17.43C13.07,17.93 13,18.46 13,19V19.46L12,19.5C7,19.5 2.73,16.39 1,12C2.73,7.61 7,4.5 12,4.5Z" />
                </svg>
                <svg class="delete-book-btn" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <title>Delete book</title>
                    <path
                        d="M9,3V4H4V6H5V19A2,2 0 0,0 7,21H17A2,2 0 0,0 19,19V6H20V4H15V3H9M7,6H17V19H7V6M9,8V17H11V8H9M13,8V17H15V8H13Z" />
                </svg>
            </div>
        </div>

    </div>
    <div class="footer">The Odin Project 2026: Library Project</div>



    <dialog id="add-book-dialog">
        <svg class="close-dialog-btn" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path
                d="M20 6.91L17.09 4L12 9.09L6.91 4L4 6.91L9.09 12L4 17.09L6.91 20L12 14.91L17.09 20L20 17.09L14.91 12L20 6.91Z" />
        </svg>
        <form action="" class="add-book-form">
            <h2 class="dialog-header">Add new book</h2>
            <div class="form-main">
                <div class="form-parth">
                    <label for="title">Title:</label>
                    <div class="input-field"><input type="text" id="title" required minlength="1" maxlength="30"
                            placeholder="1984" name="title">
                        <p title="Required">*</p>
                    </div>
                </div>
                <div class="form-parth">
                    <label for="author">Author:</label>
                    <div class="input-field"><input type="text" id="author" required minlength="2" maxlength="30"
                            placeholder="George Orwell" name="author">
                        <p title="Required">*</p>
                    </div>
                </div>
                <div class="form-parth">
                    <label for="pages">Pages:</label>
                    <div class="input-field"><input type="number" id="pages" required min="5" max="2000"
                            placeholder="352" name="pages">
                        <p title="Required">*</p>
                    </div>
                </div>
                <fieldset>
                    <legend>Status:</legend>
                    <label for="read">
                        Read <input type="radio" id="read" name="status">
                    </label>
                    <label for="unread">
                        Unread <input type="radio" id="unread" name="status" checked>
                    </label>
                </fieldset>
                <button type="submit" class="add-book-dialog-btn">Add book</button>
            </div>
            <div class="cover-uploader">
                <div class="cover-preview" id="coverPreview">
                    <span>Add book cover</span>
                </div>
                <input type="file" accept="image/png, image/jpeg" id="book-cover" style="display: none;">
            </div>



        </form>

    </dialog>
    <script src="library.js"></script>
</body>

</html>
